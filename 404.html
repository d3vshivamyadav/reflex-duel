<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>404 — Arena Not Found | ReflexDuel ⚡</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0B0D10" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 10%, rgba(244, 63, 94, 0.14), transparent 55%), #0B0D10;
      color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #14181F;
      border: 1px solid #222936;
      border-radius: 24px;
      padding: 36px 24px;
      text-align: center;
    }
    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      color: #F43F5E;
      margin: 0 0 12px;
    }
    h1 {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 26px;
      margin: 0 0 10px;
    }
    p {
      color: #94A3B8;
      font-size: 15px;
      line-height: 1.55;
      margin: 0 0 24px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      border-radius: 14px;
      background: #10B981;
      color: #022C22;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }
    .cta:hover { background: #34D399; }
  </style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>False Start — Page Not Found</h1>
    <p>The reflex duel link or route you requested does not exist on ReflexDuel. Jump back into the main arena to test your reaction time or 5-second CPS.</p>
    <a class="cta" href="/">⚡ Return to ReflexDuel Arena</a>
  </main>
</body>
</html>
